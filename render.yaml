services:
  - type: web
    name: periquito-api
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: PeriquitoManagement
      - key: Jwt__Audience
        value: PeriquitoManagementFrontend
      - key: Jwt__ExpirationMinutes
        value: "30"
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: BootstrapUsers__Enabled
        sync: false
      - key: BootstrapUsers__Administrator__Username
        sync: false
      - key: BootstrapUsers__Administrator__FullName
        sync: false
      - key: BootstrapUsers__Administrator__Password
        sync: false
      - key: BootstrapUsers__Waiter__Username
        sync: false
      - key: BootstrapUsers__Waiter__FullName
        sync: false
      - key: BootstrapUsers__Waiter__Password
        sync: false

  - type: web
    name: periquito-frontend
    runtime: static
    rootDir: periquito-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
